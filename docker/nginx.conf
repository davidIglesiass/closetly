server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php;

    # A seller uploading a cover photo plus a few gallery images easily
    # exceeds nginx's 1M default well before PHP's own upload limits kick in.
    client_max_body_size 20m;

    # Never serve secrets, DB dumps or repo metadata as static files.
    location ~ /\.(env|git) {
        deny all;
    }
    location ~ \.(sql|md)$ {
        deny all;
    }

    # Serve static assets with proper MIME types
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ @rewrite;
    }

    # Mirrors the project's .htaccess: /controller/action(&params) -> index.php
    location @rewrite {
        rewrite ^/(.*)/(.*)$ /index.php?controller=$1&action=$2 last;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
